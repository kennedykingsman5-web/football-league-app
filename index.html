<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Football League</title>
<style>
  body { margin: 0; background: #0a0a0a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  .screen { display: none; flex-direction: column; min-height: 100vh; padding: 20px; box-sizing: border-box; }
  .screen.active { display: flex; }
  .logo { font-size: 40px; font-weight: 900; text-align: center; color: #20e58a; margin-top: 50px; text-shadow: 0 0 20px rgba(32,229,138,0.5); }
  .subtitle { text-align: center; color: #888; margin-bottom: 40px; }
  .input-group { margin-bottom: 15px; }
  .input-group label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
  .input-group input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 16px; box-sizing: border-box; }
  .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #20e58a; color: #000; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 10px; }
  .btn:active { opacity: 0.8; }
  .switch-text { text-align: center; margin-top: 20px; color: #888; font-size: 14px; }
  .switch-text span { color: #20e58a; font-weight: bold; cursor: pointer; }
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
  .header h2 { margin: 0; color: #20e58a; }
  .logout-btn { background: #ff4d67; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; }
  .card { background: #1a1a1a; border-radius: 15px; padding: 15px; margin-bottom: 20px; border: 1px solid #333; }
  .card h3 { margin-top: 0; color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: #888; padding: 10px 5px; border-bottom: 2px solid #333; }
  td { padding: 10px 5px; border-bottom: 1px solid #222; }
  .team-name { font-weight: bold; }
  .pts { color: #20e58a; font-weight: 900; }
  .share-btn { background: #25D366; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }
</style>
</head>
<body>

  <div id="loginScreen" class="screen active">
    <div class="logo">⚽ League</div>
    <div class="subtitle">Sign in to manage your league</div>
    <div class="input-group"><label>Email</label><input type="email" id="authEmail" placeholder="you@example.com"></div>
    <div class="input-group"><label>Password</label><input type="password" id="authPassword" placeholder="••••••••"></div>
    <div class="input-group" id="nameField" style="display:none;"><label>Your Name</label><input type="text" id="authName" placeholder="Kenny"></div>
    <button class="btn" id="authSubmit">Login</button>
    <div class="switch-text" id="switchAuth">Don't have an account? <span>Sign Up</span></div>
  </div>

  <div id="dashboardScreen" class="screen">
    <div class="header">
      <h2>League Table</h2>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
    <div class="card">
      <h3>Current Standings</h3>
      <table>
        <thead><tr><th>Pos</th><th>Team</th><th>P</th><th>GD</th><th>Pts</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="5" style="text-align:center; color:#888;">No teams yet. Post a result!</td></tr></tbody>
      </table>
    </div>
    <div class="card">
      <h3>Post Result</h3>
      <div class="input-group"><input type="text" id="homeTeam" placeholder="Home Team"></div>
      <div class="input-group"><input type="number" id="homeScore" placeholder="Home Score"></div>
      <div class="input-group"><input type="text" id="awayTeam" placeholder="Away Team"></div>
      <div class="input-group"><input type="number" id="awayScore" placeholder="Away Score"></div>
      <button class="btn" id="addResultBtn" style="background:#20e58a; color:#000;">Add Match Result</button>
    </div>
    <button class="btn share-btn" id="shareBtn">Share League to WhatsApp</button>
  </div>

  <script>
    function getUsers() { return JSON.parse(localStorage.getItem('users') || '[]'); }
    function saveUsers(users) { localStorage.setItem('users', JSON.stringify(users)); }
    function getTeams() { return JSON.parse(localStorage.getItem('teams') || '[]'); }
    function saveTeams(teams) { localStorage.setItem('teams', JSON.stringify(teams)); }

    let isSignUp = false;
    document.getElementById('switchAuth').addEventListener('click', () => {
      isSignUp = !isSignUp;
      document.getElementById('nameField').style.display = isSignUp ? 'block' : 'none';
      document.getElementById('authSubmit').innerText = isSignUp ? 'Create Account' : 'Login';
      document.getElementById('switchAuth').innerHTML = isSignUp ? 'Already have an account? <span>Login</span>' : "Don't have an account? <span>Sign Up</span>";
    });

    document.getElementById('authSubmit').addEventListener('click', () => {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const name = document.getElementById('authName').value;
      if (!email || !password) return alert("Please fill in all fields");

      const users = getUsers();
      if (isSignUp) {
        if (users.find(u => u.email === email)) return alert("Account already exists. Please login.");
        users.push({ email, password, name });
        saveUsers(users);
        alert("Account created! You can now log in.");
        document.getElementById('switchAuth').click();
      } else {
        const user = users.find(u => u.email === email && u.password === password);
        if (!user) return alert("Incorrect email or password.");
        localStorage.setItem('currentUser', email);
        document.getElementById('loginScreen').classList.remove('active');
        document.getElementById('dashboardScreen').classList.add('active');
        loadTable();
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('currentUser');
      location.reload();
    });

    function loadTable() {
      const teams = getTeams();
      const tbody = document.getElementById('tableBody');
      if (teams.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#888;">No teams yet. Add a result below!</td></tr>`;
        return;
      }
      teams.sort((a, b) => b.points - a.points || b.gd - a.gd);
      tbody.innerHTML = teams.map((team, index) => `
        <tr><td>${index + 1}</td><td class="team-name">${team.name}</td><td>${team.played || 0}</td><td>${team.gd || 0}</td><td class="pts">${team.points || 0}</td></tr>
      `).join('');
    }

    document.getElementById('addResultBtn').addEventListener('click', () => {
      const homeName = document.getElementById('homeTeam').value.trim();
      const homeScore = parseInt(document.getElementById('homeScore').value);
      const awayName = document.getElementById('awayTeam').value.trim();
      const awayScore = parseInt(document.getElementById('awayScore').value);
      if (!homeName || !awayName || isNaN(homeScore) || isNaN(awayScore)) return alert("Please fill in all match details.");

      let teams = getTeams();
      function updateTeam(name, goalsFor, goalsAgainst, isWin, isDraw) {
        let team = teams.find(t => t.name.toLowerCase() === name.toLowerCase());
        if (!team) { team = { name: name, played: 0, points: 0, gd: 0 }; teams.push(team); }
        team.played += 1; team.gd += (goalsFor - goalsAgainst);
        if (isWin) team.points += 3; if (isDraw) team.points += 1;
      }
      const isDraw = homeScore === awayScore;
      updateTeam(homeName, homeScore, awayScore, homeScore > awayScore, isDraw);
      updateTeam(awayName, awayScore, homeScore, awayScore > homeScore, isDraw);
      saveTeams(teams); loadTable();
      document.getElementById('homeTeam').value = ''; document.getElementById('homeScore').value = '';
      document.getElementById('awayTeam').value = ''; document.getElementById('awayScore').value = '';
    });

    document.getElementById('shareBtn').addEventListener('click', async () => {
      try {
        if (window.Capacitor && window.Capacitor.Plugins.Share) {
          await window.Capacitor.Plugins.Share.share({ title: 'Football League', text: 'Join our football league!', url: 'https://kennedykingsman5-wel.github.io/football-league-app/', dialogTitle: 'Share League' });
        } else { alert("Share this link: https://kennedykingsman5-wel.github.io/football-league-app/"); }
      } catch (e) { alert("Share failed."); }
    });

    if (localStorage.getItem('currentUser')) {
      document.getElementById('loginScreen').classList.remove('active');
      document.getElementById('dashboardScreen').classList.add('active');
      loadTable();
    }
  </script>
</body>
  </html>
